[package]
name = "ldr2pdf_render_3d"
version.workspace = true
edition.workspace = true

[dependencies]
ldr2pdf_common.path = "../common"
glam.workspace = true
weldr.workspace = true

dirs = "6.0.0"
flat-zip = "0.1.0"
notify = "8.0.0"
bytemuck = "1.22.0"
argh = { version = "0.1.13", default-features = false }
indexmap = { version = "2.9.0", optional = true}

# iyes_perf_ui = { version = "0.4.0", optional = true }
bevy_blendy_cameras = "0.7.0"
# bevy_lines = { path = "../bevy_lines", optional = true }

#[dependencies.bevy_mod_outline]
#version = "0.9.2"
#optional = true
#default-features = false
#features = ["flood"]

[dependencies.bevy]
version = "0.16.0"
default-features = false
features = [
  "multi_threaded",
  "dynamic_linking",
  "bevy_pbr",
  "bevy_winit",
  "tonemapping_luts",
]

[features]
default = []
# overlay = ["dep:iyes_perf_ui", "bevy/default_font", "dep:indexmap"]
overlay = []
# outline = ["dep:bevy_mod_outline"]
outline = []
# line = ["dep:bevy_lines"]
line = []
