[package]
name = "ldr2pdf_render_3d"
version.workspace = true
edition.workspace = true

[dependencies]
ldr2pdf_common.path = "../common"
glam.workspace = true
weldr.workspace = true

dirs = "6.0.0"

bevy_flycam = "0.15.0"
bevy_lines.path = "../bevy_lines"
bytemuck = "1.22.0"

iyes_perf_ui = { version = "0.4.0", optional = true }

[dependencies.bevy]
version = "0.15.3"
default-features = false
features = [
  "multi_threaded",
  "dynamic_linking",
  "bevy_pbr",
  "bevy_winit",
  "tonemapping_luts",
]

[features]
# default = ["overlay"]
overlay = ["dep:iyes_perf_ui", "bevy/default_font"]
